maintainers:
- github: Lesterhuis-Training-en-Consultancy
- github: gemguardian

# LTNC CVD-beleid (Confluence LST); e-mailadres als security-contact bevestigd door de registry.
security-contact: security@ltnc.nl

# Code vrij, geen gratis support; betaalde support beschikbaar.
labels: [fully-free, commercial-support-available]

overrides:
  # Heeft een verbinding met een extern WISA-systeem nodig.
  local_wisa:
    labels: [external-account, paid-service, commercial-support-available]

# format_vsf bewust NIET uitgesloten: de bestaande individuele claim wordt via het
# claim-issue omgezet naar deze organisatieclaim (bevestigd door de registry).
# Forks en gearchiveerde repos blijven buiten de claim.
exclude: [block_configurable_reports, enrol_attributes, block_user_favorites, block_genericotemp, tool_groupautoenrol]
